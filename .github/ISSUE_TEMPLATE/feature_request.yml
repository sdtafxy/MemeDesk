name: Feature request / 功能建议
description: Suggest an idea or an improvement / 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 想解决的问题
      description: What is awkward or impossible today?
      placeholder: I cannot keep a set of stickers together when switching displays...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议做法
      placeholder: Add an option to group stickers so they move together.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact on resource use / 对资源占用的影响
      description: MemeDesk runs all day. Does this idea add per-frame work?
      options:
        - "None / 无"
        - "One-off work / 一次性开销"
        - "Per-frame work / 每帧开销"
        - "Not sure / 不确定"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 其他方案
    validations:
      required: false
