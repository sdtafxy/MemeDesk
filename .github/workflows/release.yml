name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # ⚠️ 发版前**必须**确认 tag 与包内版本一致。
      # 不一致的话：Release 叫 v0.1.7、里面的 App 却报 0.1.6，
      # 而更新器 `release.version > current` 永远成立 → 每次启动都提示装同一个更新。
      - name: Check version consistency (with tag)
        run: ./Scripts/check_version.sh "${{ steps.version.outputs.tag }}"

      # 公钥与私钥两头一致：只配一半，用户要么更不了、要么签了没人验。
      - name: Check update-signing configuration
        env:
          MEMEDESK_UPDATE_SIGNING_KEY: ${{ secrets.MEMEDESK_UPDATE_SIGNING_KEY }}
        run: ./Scripts/check_update_signing.sh

      - name: Build
        run: swift build -c release

      - name: Assemble app bundle
        run: ./Scripts/build.sh

      - name: Package DMG
        run: ./Scripts/make_dmg.sh

      - name: Package update archive (zip)
        env:
          SIGNING_KEY_PEM: ${{ secrets.MEMEDESK_UPDATE_SIGNING_KEY }}
        run: |
          # 配了 Ed25519 私钥就顺手签名；没配就只出 zip + sha256。
          if [ -n "$SIGNING_KEY_PEM" ]; then
            python3 -m pip install --quiet cryptography
            printf '%s\n' "$SIGNING_KEY_PEM" > "$RUNNER_TEMP/update-key.pem"
            export MEMEDESK_UPDATE_SIGNING_KEY="$RUNNER_TEMP/update-key.pem"
            echo "Signing the update archive."
          else
            echo "No MEMEDESK_UPDATE_SIGNING_KEY secret — shipping an unsigned archive."
          fi
          ./Scripts/make_zip.sh

      # ⚠️ 抽不到就**非零退出**，绝不能让一个空正文的 Release 发出去。
      # 老写法是直接 `awk | sed > release_notes.md`：CHANGELOG 里没有 `## [` 标题、
      # 或者整个文件缺失，都会**安静地写出 0 字节并返回 0**，于是发布一个空正文的 Release。
      - name: Collect release notes
        run: ./Scripts/release_notes.sh "${{ steps.version.outputs.tag }}" release_notes.md

      - name: Check artefacts
        run: ./Scripts/check_artifacts.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MemeDesk ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
            dist/*.ed25519
