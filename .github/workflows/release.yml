name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: swift build -c release

      - name: Assemble app bundle
        run: ./Scripts/build.sh

      - name: Package DMG
        run: ./Scripts/make_dmg.sh

      - name: Package update archive (zip)
        env:
          SIGNING_KEY_PEM: ${{ secrets.MEMEDESK_UPDATE_SIGNING_KEY }}
        run: |
          # 配了 Ed25519 私钥就顺手签名；没配就只出 zip + sha256。
          if [ -n "$SIGNING_KEY_PEM" ]; then
            python3 -m pip install --quiet cryptography
            printf '%s\n' "$SIGNING_KEY_PEM" > "$RUNNER_TEMP/update-key.pem"
            export MEMEDESK_UPDATE_SIGNING_KEY="$RUNNER_TEMP/update-key.pem"
            echo "Signing the update archive."
          else
            echo "No MEMEDESK_UPDATE_SIGNING_KEY secret — shipping an unsigned archive."
          fi
          ./Scripts/make_zip.sh

      - name: Collect release notes
        run: |
          # 只取 CHANGELOG 里最新的一段，标题去掉版本号方块
          awk 'BEGIN{on=0} /^## \[/{if (on) exit; on=1} on{print}' CHANGELOG.md \
            | sed -e '1s/^## \[[^]]*\] - /## /' > release_notes.md
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MemeDesk ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
            dist/*.ed25519
