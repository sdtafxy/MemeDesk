name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Assemble app bundle
        run: ./Scripts/build.sh

      - name: Package DMG
        run: ./Scripts/make_dmg.sh

      - name: Package update archive (zip)
        run: ./Scripts/make_zip.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MemeDesk-dmg
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
