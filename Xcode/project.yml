# XcodeGen 工程描述
# 用法： brew install xcodegen && xcodegen -s Xcode/project.yml
name: MemeDesk

options:
  bundleIdPrefix: com.memedesk
  deploymentTarget:
    macOS: "13.0"
  groupSortPosition: none
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  MemeDesk:
    type: application
    platform: macOS
    sources:
      - path: Sources/MemeDesk
      - path: Sources/MemeDeskShared
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/Samples
        buildPhase: resources
    entitlements: path: Resources/Entitlements.plist
    info:
      path: Resources/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.memedesk.app
      PRODUCT_MODULE_NAME: MemeDesk
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Resources/Info.plist
      LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../Frameworks"
